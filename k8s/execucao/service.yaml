# ClusterIP: a API so e alcancada pelo ingress-nginx (e, por ele, pela APIM); nada expoe o pod direto na internet.
apiVersion: v1
kind: Service
metadata:
  name: oficinamecanica-execucao
  namespace: default
  labels:
    app: oficinamecanica-execucao
spec:
  type: ClusterIP
  selector:
    app: oficinamecanica-execucao
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
