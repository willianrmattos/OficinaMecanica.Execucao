# Defini o teto em 2 replicas: o no unico do AKS (Standard_D4as_v4) nao tem folga de CPU de requests para mais que isso, e
# uma replica extra da Execucao e segura (o claim da fila grava com checagem de Version, entao dois pods nunca recebem a
# mesma ordem, e o inbox do MassTransit deduplica a mensagem entregue duas vezes).
# Os percentuais sao sobre o REQUEST do deployment.yaml (CPU 50m, memoria 192Mi), que e pequeno de proposito:
# 70% de 50m sao 35m, entao qualquer rajada de requisicoes faz a segunda replica subir.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: oficinamecanica-execucao
  namespace: default
  labels:
    app: oficinamecanica-execucao
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: oficinamecanica-execucao
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
